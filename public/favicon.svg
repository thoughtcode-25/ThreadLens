<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark background rounded tile -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  
  <!-- Outer Shield Outline -->
  <path d="M32 8L50 16V31C50 43.5 42.5 51.5 32 56C21.5 51.5 14 43.5 14 31V16L32 8Z" 
        stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round" fill="none" />
  
  <!-- Inner Shield Glow Fill -->
  <path d="M32 13L46 19.5V31C46 41 40 47.5 32 51.5C24 47.5 18 41 18 31V19.5L32 13Z" 
        fill="url(#shieldGrad)" fill-opacity="0.15" />
        
  <!-- Forensic Lens / Radar Center Element -->
  <circle cx="32" cy="30" r="8" stroke="url(#glowGrad)" stroke-width="2.5" fill="#0b0f19" filter="url(#glow)" />
  <circle cx="32" cy="30" r="3.5" fill="#38bdf8" />
  
  <!-- Crosshair / Scan Lines -->
  <line x1="32" y1="18" x2="32" y2="23" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="37" x2="32" y2="42" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="30" x2="25" y2="30" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="30" x2="44" y2="30" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
</svg>
